openapi: 3.0.3
info:
  title: ARAM Vision Provider Fixture Contract
  version: 1.1.0
  description: |
    Local-only response fixtures for the public Gemini generateContent and OpenAI chat completions
    request shapes.

    Scenario routing: `x-akari-e2e-scenario` header (opening-match | augment-pick | probe) wins over
    prompt detection. The current main-process prompt uses `## Output contract` plus
    `1) 推荐` (augment) or `1) 定位` (lineup); fixture bodies follow those short sections and include
    a stable `[e2e:…]` anchor. Requests normally omit `max_tokens`.
servers:
  - url: http://127.0.0.1:4900/providers
paths:
  /health:
    get:
      operationId: health
      summary: Mock health and supported scenarios
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scenarios:
                    type: array
                    items: { type: string, enum: [opening-match, augment-pick, probe] }
  /openai/v1/chat/completions:
    post:
      operationId: openaiChatCompletion
      summary: OpenAI-compatible multimodal chat completion fixture
      parameters:
        - $ref: '#/components/parameters/E2eScenario'
        - $ref: '#/components/parameters/E2eLocale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user] }
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              oneOf:
                                - type: object
                                  required: [type, text]
                                  properties:
                                    type: { type: string, enum: [text] }
                                    text: { type: string }
                                - type: object
                                  required: [type, image_url]
                                  properties:
                                    type: { type: string, enum: [image_url] }
                                    image_url:
                                      type: object
                                      required: [url]
                                      properties:
                                        url:
                                          {
                                            type: string,
                                            format: uri,
                                            description: Base64 image data URI.
                                          }
                temperature: { type: number }
                max_tokens:
                  type: integer
                  description: Optional; current League Akari requests omit it.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Generated text
          headers:
            x-akari-e2e-scenario:
              description: Scenario actually used by the fixture.
              schema: { type: string, enum: [opening-match, augment-pick, probe] }
          content:
            application/json:
              schema:
                type: object
                required: [id, object, model, choices]
                properties:
                  id: { type: string }
                  object: { type: string, enum: [chat.completion] }
                  model:
                    type: string
                    description: Echoes the request model, or `e2e-mock` when absent.
                  choices:
                    type: array
                    items:
                      type: object
                      required: [index, finish_reason, message]
                      properties:
                        index: { type: integer }
                        finish_reason: { type: string, enum: [stop] }
                        message:
                          type: object
                          properties:
                            role: { type: string, enum: [assistant] }
                            content: { type: string }
              example:
                id: chatcmpl-e2e-mock
                object: chat.completion
                model: e2e-augment-pick
                choices:
                  - index: 0
                    finish_reason: stop
                    message:
                      role: assistant
                      content: "[e2e:augment-pick]\n1) 推荐\n秘术冲拳 — 开场即可提升技能周转。\n\n2) 出装\n核心：卢登的伙伴；可选：中娅沙漏。\n\n3) 打法\n- 站后排，等前排开团。\n"
  /gemini/v1beta/models/{model}:generateContent:
    post:
      operationId: geminiGenerateContent
      summary: Gemini multimodal generateContent fixture
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/E2eScenario'
        - $ref: '#/components/parameters/E2eLocale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contents]
              properties:
                contents:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user] }
                      parts:
                        type: array
                        items:
                          oneOf:
                            - type: object
                              required: [text]
                              properties:
                                text: { type: string }
                            - type: object
                              required: [inline_data]
                              properties:
                                inline_data:
                                  type: object
                                  required: [mime_type, data]
                                  properties:
                                    mime_type: { type: string, enum: [image/png, image/jpeg] }
                                    data: { type: string, description: Base64 image bytes. }
                generationConfig: { type: object }
      security:
        - GeminiApiKey: []
      responses:
        '200':
          description: Generated text
          headers:
            x-akari-e2e-scenario:
              description: Scenario actually used by the fixture.
              schema: { type: string, enum: [opening-match, augment-pick, probe] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: object
                          properties:
                            parts:
                              {
                                type: array,
                                items: { type: object, properties: { text: { type: string } } }
                              }
                        finishReason: { type: string, enum: [STOP] }
              example:
                candidates:
                  - finishReason: STOP
                    content:
                      parts:
                        - text: "[e2e:opening-match]\n1) 定位\n后排法术输出与先手控制。\n\n2) 出装\n核心：卢登的伙伴。\n\n3) 打法\n- 站后排，等前排开团。\n"
components:
  parameters:
    E2eScenario:
      name: x-akari-e2e-scenario
      in: header
      required: false
      description: Force a fixture scenario; wins over prompt detection.
      schema:
        type: string
        enum: [opening-match, augment-pick, probe]
    E2eLocale:
      name: x-akari-e2e-locale
      in: header
      required: false
      description: Fixture language; defaults to zh.
      schema:
        type: string
        enum: [zh, en]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    GeminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
