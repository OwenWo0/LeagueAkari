  error:
    title: Assistant request failed
    CREDENTIAL_STORAGE_FAILED: The credential could not be stored or cleared safely.
    INVALID_PROTOCOL: Choose Gemini native or OpenAI-compatible protocol.
    INVALID_BASE_URL: Use an HTTPS API base URL or a literal loopback HTTP URL.
    INVALID_INPUT: Check the selected card, champion, and request details.
    INVALID_IMAGE: The image is invalid or could not be decoded.
    IMAGE_TOO_LARGE: The image exceeds the allowed size.
    CONFIG_ERROR: Check the provider, model, and credential settings.
    AUTH_ERROR: The provider rejected the credential.
    RATE_LIMITED: The provider is rate limiting requests. Try again later.
    TIMEOUT: The request exceeded its time limit.
    NETWORK_ERROR: The provider could not be reached.
    REDIRECT_BLOCKED: Provider redirects are blocked.
    UPSTREAM_ERROR: The provider returned an error response.
    INVALID_RESPONSE: The provider response was invalid.
    RESPONSE_TOO_LARGE: The provider response exceeds the allowed size.
    EMPTY_RESPONSE: The provider returned no response text.
    BLOCKED_RESPONSE: The provider did not provide an answer for this request.
    OUTPUT_TRUNCATED: The response reached the model output limit.
    CANCELLED: The request was cancelled.
    SCREEN_PERMISSION_REQUIRED: Allow screen recording for League Akari in macOS Privacy & Security settings, then try again.
    SCREEN_PERMISSION_DENIED: Allow screen recording for League Akari in macOS Privacy & Security settings.
    SCREEN_PERMISSION_RESTRICTED: macOS currently restricts screen recording.
    SCREEN_CAPTURE_FAILED: The selected display could not be captured.
    TOO_LARGE: Catalog source exceeds the allowed size.
    SOURCE_HTML: Catalog source did not return JSON.
    INVALID_SCHEMA: Catalog data does not match the supported schema.
    INVALID_PATCH: Catalog patch information is invalid.
    PATCH_ROLLBACK: An older catalog cannot replace the current one.
    SUDDEN_DROP: The same-patch catalog has too many missing records.
    TOO_FEW_CARDS: Catalog has fewer than the minimum number of records.
    ATOMIC_WRITE_FAILED: Catalog could not be saved safely.
    fallback: The request could not be completed.
